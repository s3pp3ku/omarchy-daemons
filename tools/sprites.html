<!doctype html><meta charset="utf-8"><title>sprite sheet</title>
<body style="background:#0a0e12;margin:10px;color:#ccc;font:12px monospace">
<script src="../js/gfx/palette.js"></script><script src="../js/gfx/sprites.js"></script>
<canvas id="c"></canvas>
<script>
const A=OL.Sprites.buildAtlas(document); const s=6, c=document.getElementById('c');
c.width=A.canvas.width*s; c.height=A.canvas.height*s; const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
x.fillStyle='#1b2a24'; for(let i=0;i<c.width;i+=A.FW*s) x.fillRect(i,0,1,c.height);
x.drawImage(A.canvas,0,0,c.width,c.height);
x.fillStyle='rgba(255,0,80,.6)'; for(const n in A.index){const r=A.index[n].row; for(let i=0;i<A.index[n].n*2;i++) x.fillRect((i*A.FW+A.OX)*s,(r*A.FH+A.OY+1)*s,s,2);}
</script>
