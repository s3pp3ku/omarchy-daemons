<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omarchy Daemons</title>
<meta name="description" content="Think ahead. Save them all. A Daemons tribute set in the Omarchy world.">
<link rel="stylesheet" href="css/style.css?v=1791416906">
</head>
<body>
  <header id="hud">
    <div class="wb-left"><span class="wb-mark" title="Omarchy Daemons"></span><div id="wb-ws"></div></div>
    <div class="wb-center" id="hud-level"></div>
    <div class="wb-right" id="hud-stats"></div>
  </header>

  <main id="stage">
    <canvas id="screen"></canvas>
    <div id="hover-tag"></div>
    <div id="journal"></div>
    <div id="toast"></div>
    <div id="overlay"></div>
    <aside id="debug" hidden></aside>
  </main>

  <footer id="dock">
    <div class="rate">
      <button id="rate-dn" title="Slower release (−)">−</button>
      <div><b id="rate-val">50</b><small>RELEASE</small></div>
      <button id="rate-up" title="Faster release (+)">+</button>
    </div>
    <div id="skills"></div>
    <div class="ctrl">
      <button id="btn-pause" title="Pause (Space)">❚❚</button>
      <button id="btn-speed" title="Speed (F)">1×</button>
      <button id="btn-restart" title="Restart (R)">↺</button>
      <button id="btn-nuke" title="Nuke — press twice (N)">☢</button>
    </div>
    <canvas id="minimap" width="240" height="60" title="Minimap — click to jump"></canvas>
  </footer>
